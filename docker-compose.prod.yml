# Produção — aplicado junto do docker-compose.yml base:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# NÃO usa docker-compose.override.yml (esse é só dev, aplicado automaticamente pelo
# `docker compose up` sem -f explícito).
services:
  db:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    restart: unless-stopped
    # maxmemory + noeviction: Redis também é broker/result do Celery (mesmo REDIS_URL
    # do CACHES) — não pode descartar mensagem de fila por eviction de cache.
    command: redis-server --maxmemory 256mb --maxmemory-policy noeviction
    deploy:
      resources:
        limits:
          memory: 300M

  web:
    container_name: zelo-web
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
    networks:
      - default
      - proxy
    deploy:
      resources:
        limits:
          memory: 512M

  celery_worker:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 384M

  celery_beat:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 150M

networks:
  proxy:
    name: nginx-proxy-manager_default
    external: true

volumes:
  media:
    name: zelo_media
  static:
    name: zelo_static
