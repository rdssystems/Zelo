<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" id="supplier-modal">
  <div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm"
       onclick="document.getElementById('modal-slot').innerHTML = ''"></div>
  <div class="relative w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-8">
      <div class="flex justify-between items-start mb-8">
        <h3 class="font-display text-headline-sm text-on-surface">{{ title }}</h3>
        <button class="text-outline hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container"
                onclick="document.getElementById('modal-slot').innerHTML = ''">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      {% if form.non_field_errors %}
      <div class="mb-6 rounded-lg bg-error-container text-on-error-container px-4 py-3 text-sm">{{ form.non_field_errors|join:" " }}</div>
      {% endif %}

      <form {% if supplier %}hx-post="{% url 'inventory:supplier_update' supplier.pk %}"{% else %}hx-post="{% url 'inventory:supplier_create' %}"{% endif %}
            hx-target="#supplier-items" hx-swap="outerHTML" class="space-y-6">
        {% csrf_token %}
        <div>
          <label class="block text-label-caps uppercase text-outline mb-1" for="id_name">Nome do fornecedor</label>
          <input class="block w-full px-0 py-2 bg-transparent border-0 border-b {% if form.name.errors %}border-error{% else %}border-outline-variant{% endif %} text-on-surface text-lg focus:ring-0 focus:border-primary transition-colors"
                 id="id_name" name="name" type="text" value="{{ form.name.value|default:'' }}" required maxlength="120"/>
          {% if form.name.errors %}<p class="text-error text-sm mt-1">{{ form.name.errors|join:" " }}</p>{% endif %}
        </div>
        <div class="grid grid-cols-2 gap-6">
          <div>
            <label class="block text-label-caps uppercase text-outline mb-1" for="id_contact_name">Contato</label>
            <input class="block w-full px-0 py-2 bg-transparent border-0 border-b border-outline-variant text-on-surface focus:ring-0 focus:border-primary transition-colors"
                   id="id_contact_name" name="contact_name" type="text" value="{{ form.contact_name.value|default:'' }}" maxlength="120"/>
          </div>
          <div>
            <label class="block text-label-caps uppercase text-outline mb-1" for="id_phone">Telefone</label>
            <input class="block w-full px-0 py-2 bg-transparent border-0 border-b border-outline-variant text-on-surface focus:ring-0 focus:border-primary transition-colors"
                   id="id_phone" name="phone" type="text" value="{{ form.phone.value|default:'' }}" maxlength="20"/>
          </div>
        </div>
        <div>
          <label class="block text-label-caps uppercase text-outline mb-1" for="id_email">E-mail</label>
          <input class="block w-full px-0 py-2 bg-transparent border-0 border-b {% if form.email.errors %}border-error{% else %}border-outline-variant{% endif %} text-on-surface focus:ring-0 focus:border-primary transition-colors"
                 id="id_email" name="email" type="email" value="{{ form.email.value|default:'' }}"/>
          {% if form.email.errors %}<p class="text-error text-sm mt-1">{{ form.email.errors|join:" " }}</p>{% endif %}
        </div>
        <div>
          <label class="block text-label-caps uppercase text-outline mb-1" for="id_notes">Observações</label>
          <textarea class="block w-full px-0 py-2 bg-transparent border-0 border-b border-outline-variant text-on-surface focus:ring-0 focus:border-primary transition-colors" id="id_notes" name="notes" rows="2">{{ form.notes.value|default:'' }}</textarea>
        </div>
        <div class="pt-4 flex justify-end gap-4">
          <button class="px-6 py-3 rounded-pill border border-outline text-on-surface-variant hover:bg-surface-container transition-colors" type="button"
                  onclick="document.getElementById('modal-slot').innerHTML = ''">Cancelar</button>
          <button class="px-8 py-3 rounded-pill bg-primary text-on-primary font-semibold hover:opacity-90 transition-opacity active:scale-95" type="submit">Salvar</button>
        </div>
      </form>
    </div>
  </div>
</div>
