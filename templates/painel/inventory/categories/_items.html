<div id="category-items" class="bg-surface-container-lowest rounded-2xl border border-surface-variant shadow-[0_4px_40px_-10px_rgba(125,86,45,0.08)] overflow-hidden">
  <div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="border-b border-surface-variant bg-surface-container-low/50">
          <th class="py-4 px-6 text-label-caps uppercase text-on-surface-variant">Nome</th>
          <th class="py-4 px-6 text-label-caps uppercase text-on-surface-variant text-center">Produtos</th>
          <th class="py-4 px-6 text-label-caps uppercase text-on-surface-variant text-right">Ações</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-surface-variant">
        {% for category in categories %}
        <tr class="hover:bg-surface-container-low/50 transition-colors">
          <td class="py-4 px-6 font-semibold text-on-surface">{{ category.name }}</td>
          <td class="py-4 px-6 text-center text-on-surface-variant">{{ category.product_count }}</td>
          <td class="py-4 px-6">
            <div class="flex justify-end gap-1">
              <button class="p-2 text-outline hover:text-primary transition-colors rounded-full hover:bg-surface-variant" title="Editar"
                      hx-get="{% url 'inventory:category_update' category.pk %}" hx-target="#modal-slot" hx-swap="innerHTML">
                <span class="material-symbols-outlined">edit</span>
              </button>
              <button class="p-2 text-outline hover:text-error transition-colors rounded-full hover:bg-error-container/40" title="Excluir"
                      hx-get="{% url 'inventory:category_delete_confirm' category.pk %}" hx-target="#modal-slot" hx-swap="innerHTML">
                <span class="material-symbols-outlined">delete</span>
              </button>
            </div>
          </td>
        </tr>
        {% empty %}
        <tr>
          <td class="py-16 text-center text-on-surface-variant" colspan="3">
            Nenhuma categoria cadastrada ainda.
            <button class="ml-2 text-primary font-semibold hover:underline"
                    hx-get="{% url 'inventory:category_create' %}" hx-target="#modal-slot" hx-swap="innerHTML">
              Cadastrar a primeira categoria
            </button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
