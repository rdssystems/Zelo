<div id="notification-bell" class="mb-6 px-4"{% if oob %} hx-swap-oob="true"{% endif %}>
  <button type="button" hx-get="{% url 'notifications:list' %}" hx-target="#modal-slot" hx-swap="innerHTML"
          class="w-full flex items-center gap-3 text-on-surface-variant hover:text-primary transition-colors">
    <span class="relative shrink-0">
      <span class="material-symbols-outlined">notifications</span>
      {% if unread_announcements_count %}
      <span class="absolute -top-1.5 -right-1.5 bg-error text-on-error text-[10px] font-bold rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center">{{ unread_announcements_count }}</span>
      {% endif %}
    </span>
    <span class="text-sm font-medium">Novidades</span>
  </button>
</div>
