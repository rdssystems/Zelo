<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" id="assign-package-modal">
  <div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm"
       onclick="document.getElementById('modal-slot').innerHTML = ''"></div>
  <div class="relative w-full max-w-sm bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-primary-container/40 flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-primary">redeem</span>
        </div>
        <h3 class="font-display text-headline-sm text-on-surface">Ativar pacote</h3>
      </div>
      <p class="text-sm text-on-surface-variant mb-6">
        <strong class="text-on-surface">{{ package.name }}</strong> — R$ {{ package.price }}/mês para
        <strong class="text-on-surface">{{ client.name }}</strong>. Isso gera uma entrada real no Caixa agora.
      </p>
      {% if form.non_field_errors %}
      <div class="mb-4 rounded-lg bg-error-container text-on-error-container px-4 py-3 text-sm">{{ form.non_field_errors|join:" " }}</div>
      {% endif %}
      <form hx-post="{% url 'clients:package_assign' client.pk %}" hx-target="#subscription-section" hx-swap="outerHTML" class="space-y-6">
        {% csrf_token %}
        <input type="hidden" name="package" value="{{ package.pk }}"/>
        <div>
          <label class="block text-label-caps uppercase text-outline mb-1" for="id_payment_method">Forma de pagamento</label>
          <select class="block w-full px-0 py-2 bg-transparent border-0 border-b border-outline-variant focus:ring-0 focus:border-primary" id="id_payment_method" name="payment_method">
            {% for value, label in form.fields.payment_method.choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="flex justify-end gap-3">
          <button class="px-5 py-2.5 rounded-pill border border-outline text-on-surface-variant hover:bg-surface-container transition-colors text-sm" type="button"
                  onclick="document.getElementById('modal-slot').innerHTML = ''">Cancelar</button>
          <button class="px-6 py-2.5 rounded-pill bg-primary text-on-primary font-semibold hover:opacity-90 transition-opacity active:scale-95 text-sm" type="submit">
            Ativar pacote
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
