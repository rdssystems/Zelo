<div id="hours-section" class="bg-surface-container-lowest rounded-2xl shadow-[0_4px_40px_-10px_rgba(125,86,45,0.08)] border border-surface-container p-8">
  <h3 class="text-label-caps uppercase text-outline mb-2">Jornada de trabalho</h3>
  <p class="text-sm text-on-surface-variant mb-6">Marque os dias em que o profissional atende e o horário de início e fim.</p>

  {% if hours_error %}
  <div class="mb-4 rounded-lg bg-error-container text-on-error-container px-4 py-3 text-sm">{{ hours_error }}</div>
  {% elif hours_saved %}
  <div class="mb-4 rounded-lg bg-secondary-container text-on-secondary-container px-4 py-3 text-sm">Jornada salva.</div>
  {% endif %}

  <form hx-post="{% url 'employees:working_hours' employee.pk %}" hx-target="#hours-section" hx-swap="outerHTML" class="space-y-3">
    {% csrf_token %}
    {% for day in weekdays %}
    <div class="flex flex-wrap items-center gap-4 py-2 border-b border-surface-variant/50 last:border-0" x-data="{ on: {% if day.entry %}true{% else %}false{% endif %} }">
      <label class="flex items-center gap-3 w-40 shrink-0 cursor-pointer">
        <input class="rounded border-outline-variant text-primary focus:ring-primary" type="checkbox" name="day_{{ day.weekday }}_active" x-model="on"/>
        <span class="text-on-surface" :class="on ? 'font-semibold' : 'text-on-surface-variant'">{{ day.label }}</span>
      </label>
      <div class="flex items-center gap-2" x-show="on" x-cloak>
        <input class="rounded-lg border-outline-variant bg-transparent text-on-surface focus:border-primary focus:ring-primary py-1.5" type="time" name="day_{{ day.weekday }}_start" value="{% if day.entry %}{{ day.entry.start_time|time:'H:i' }}{% else %}09:00{% endif %}"/>
        <span class="text-outline">até</span>
        <input class="rounded-lg border-outline-variant bg-transparent text-on-surface focus:border-primary focus:ring-primary py-1.5" type="time" name="day_{{ day.weekday }}_end" value="{% if day.entry %}{{ day.entry.end_time|time:'H:i' }}{% else %}18:00{% endif %}"/>
      </div>
    </div>
    {% endfor %}
    <div class="pt-4 flex justify-end">
      <button class="px-6 py-2.5 rounded-full bg-primary text-on-primary font-semibold hover:opacity-90 transition-opacity active:scale-95" type="submit">Salvar jornada</button>
    </div>
  </form>
</div>
