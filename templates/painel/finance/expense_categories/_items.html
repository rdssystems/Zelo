<div id="expense-category-items" class="bg-surface-container-lowest rounded-xl shadow-[0_4px_40px_-10px_rgba(125,86,45,0.08)] border border-surface-container overflow-hidden">
  <div class="hidden md:grid grid-cols-12 gap-4 px-gutter py-4 border-b border-surface-variant bg-surface-container-low/50">
    <div class="col-span-6 text-label-caps uppercase text-outline">Nome</div>
    <div class="col-span-2 text-label-caps uppercase text-outline">Tipo</div>
    <div class="col-span-2 text-label-caps uppercase text-outline">Status</div>
    <div class="col-span-2 text-right text-label-caps uppercase text-outline">Ações</div>
  </div>
  <div class="divide-y divide-surface-variant">
    {% for category in categories %}
    <div class="grid grid-cols-1 md:grid-cols-12 gap-4 items-center px-gutter py-6 hover:bg-surface-container-low transition-colors group {% if not category.is_active %}opacity-60{% endif %}">
      <div class="col-span-1 md:col-span-6">
        <h3 class="font-display text-headline-sm text-on-surface group-hover:text-primary transition-colors">{{ category.name }}</h3>
      </div>
      <div class="col-span-1 md:col-span-2">
        {% if category.is_fixed %}
        <span class="inline-flex items-center px-3 py-1 rounded-pill bg-secondary-container text-on-secondary-container text-label-caps uppercase">Fixa</span>
        {% else %}
        <span class="inline-flex items-center px-3 py-1 rounded-pill bg-primary-container/40 text-primary text-label-caps uppercase">Variável</span>
        {% endif %}
      </div>
      <div class="col-span-1 md:col-span-2">
        {% if category.is_active %}
        <span class="inline-flex items-center px-3 py-1 rounded-pill bg-[#e8f5e9] text-[#2e7d32] text-label-caps uppercase">Ativa</span>
        {% else %}
        <span class="inline-flex items-center px-3 py-1 rounded-pill bg-error-container text-on-error-container text-label-caps uppercase">Inativa</span>
        {% endif %}
      </div>
      <div class="col-span-1 md:col-span-2 flex md:justify-end gap-1">
        <button class="p-2 text-outline hover:text-primary transition-colors rounded-full hover:bg-surface-variant" title="Editar"
                hx-get="{% url 'finance:expense_category_update' category.pk %}" hx-target="#modal-slot" hx-swap="innerHTML">
          <span class="material-symbols-outlined">edit</span>
        </button>
        <button class="p-2 transition-colors rounded-full hover:bg-surface-variant {% if category.is_active %}text-[#2e7d32] hover:text-[#1b5e20]{% else %}text-error hover:text-error{% endif %}"
                title="{% if category.is_active %}Ativa — clique para desativar{% else %}Inativa — clique para ativar{% endif %}"
                hx-get="{% url 'finance:expense_category_toggle_confirm' category.pk %}" hx-target="#modal-slot" hx-swap="innerHTML">
          <span class="material-symbols-outlined" {% if category.is_active %}style="font-variation-settings: 'FILL' 1;"{% endif %}>{% if category.is_active %}toggle_on{% else %}toggle_off{% endif %}</span>
        </button>
      </div>
    </div>
    {% empty %}
    <div class="px-gutter py-16 text-center">
      <p class="text-on-surface-variant">Nenhuma categoria de despesa cadastrada ainda.</p>
      <button class="mt-2 text-primary font-semibold hover:underline"
              hx-get="{% url 'finance:expense_category_create' %}" hx-target="#modal-slot" hx-swap="innerHTML">
        Cadastrar a primeira categoria
      </button>
    </div>
    {% endfor %}
  </div>
</div>
