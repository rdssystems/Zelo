{% extends "painel/base.html" %}

{% block title %}Zellup — Caixa{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-8">
  <div>
    <h2 class="font-display text-headline-md text-on-surface mb-2">Caixa</h2>
    <p class="text-on-surface-variant">Saldo do período, lançamentos e comissões a pagar.</p>
  </div>
  <div class="flex flex-wrap gap-3 shrink-0">
    <a href="{% url 'finance:expense_category_list' %}"
       class="flex items-center gap-2 text-on-surface-variant font-medium px-5 py-2.5 md:text-lg rounded-pill hover:bg-surface-container-high transition-colors">
      <span class="material-symbols-outlined">category</span>
      Categorias de Despesa
    </a>
    <button class="flex items-center gap-2 bg-surface-container-lowest border border-primary text-primary font-semibold px-5 py-2.5 md:text-lg md:px-8 md:py-3 rounded-pill hover:bg-primary-container/20 transition-colors active:scale-95"
            hx-get="{% url 'finance:sale_picker' %}" hx-target="#modal-slot" hx-swap="innerHTML">
      <span class="material-symbols-outlined">add_shopping_cart</span>
      Nova Venda
    </button>
    <button class="flex items-center gap-2 bg-primary text-on-primary font-semibold px-5 py-2.5 md:text-lg md:px-8 md:py-3 rounded-pill hover:opacity-90 transition-opacity shadow-sm active:scale-95"
            hx-get="{% url 'finance:expense_create' %}?start={{ start|date:'Y-m-d' }}&end={{ end|date:'Y-m-d' }}" hx-target="#modal-slot" hx-swap="innerHTML">
      <span class="material-symbols-outlined">add</span>
      Nova Despesa
    </button>
  </div>
</div>

<form class="flex flex-wrap items-center gap-4 mb-8 bg-surface-container-lowest border border-surface-variant rounded-xl p-4" method="get">
  {% include "painel/_period_preset_buttons.html" %}
  <div class="flex items-center gap-2">
    <label class="text-sm text-on-surface-variant">De</label>
    <input class="bg-transparent border-0 border-b border-outline-variant text-on-surface focus:ring-0 focus:border-primary" name="start" type="date" value="{{ start|date:'Y-m-d' }}"/>
  </div>
  <div class="flex items-center gap-2">
    <label class="text-sm text-on-surface-variant">Até</label>
    <input class="bg-transparent border-0 border-b border-outline-variant text-on-surface focus:ring-0 focus:border-primary" name="end" type="date" value="{{ end|date:'Y-m-d' }}"/>
  </div>
  <button class="md:ml-auto px-6 py-2 rounded-pill bg-primary-container text-on-primary-container font-semibold text-sm hover:opacity-90 transition-opacity" type="submit">Filtrar</button>
</form>

{% include "painel/finance/_items.html" %}
{% endblock %}
