<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" id="walk-in-service-modal"
     x-data="{ query: '' }">
  <div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm"
       onclick="document.getElementById('modal-slot').innerHTML = ''"></div>
  <div class="relative w-full max-w-lg bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden max-h-[85vh] flex flex-col">
    <div class="p-8 pb-4">
      <div class="flex justify-between items-start mb-2">
        <h3 class="font-display text-headline-sm text-on-surface">Adicionar serviço</h3>
        <button class="text-outline hover:text-on-surface transition-colors p-2 rounded-full hover:bg-surface-container"
                onclick="document.getElementById('modal-slot').innerHTML = ''">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <p class="text-sm text-on-surface-variant mb-4">{{ client.name }} — escolha o serviço extra feito na hora.</p>
      <div class="relative">
        <span class="material-symbols-outlined absolute left-0 top-1/2 -translate-y-1/2 text-outline">search</span>
        <input type="text" x-model="query" placeholder="Buscar serviço..." autofocus
               class="block w-full pl-8 pr-0 py-2 bg-transparent border-0 border-b border-outline-variant text-on-surface focus:ring-0 focus:border-primary"/>
      </div>
    </div>

    <div class="px-8 pb-8 overflow-y-auto space-y-1">
      {% if not services %}
      <p class="text-sm text-on-surface-variant italic py-8 text-center">Nenhum serviço disponível pra agendar.</p>
      {% endif %}
      {% for service in services %}
      <button type="button"
              x-show="'{{ service.name|escapejs|lower }}'.includes(query.toLowerCase())"
              hx-get="{% url 'finance:walk_in_employee_list' client.pk service.pk %}"
              hx-target="#walk-in-employees" hx-swap="innerHTML"
              class="w-full text-left px-3 py-2 rounded-lg hover:bg-surface-container-low transition-colors flex items-center justify-between gap-4">
        <span class="text-on-surface text-sm">{{ service.name }}</span>
        <span class="text-outline text-sm shrink-0">R$ {{ service.price }}</span>
      </button>
      {% endfor %}
      <div id="walk-in-employees"></div>
    </div>
  </div>
</div>
