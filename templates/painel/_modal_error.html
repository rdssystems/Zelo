<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" id="modal-error">
  <div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm"
       onclick="document.getElementById('modal-slot').innerHTML = ''"></div>
  <div class="relative w-full max-w-md bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-error">block</span>
        </div>
        <h3 class="font-display text-headline-sm text-on-surface">{{ title|default:"Não foi possível" }}</h3>
      </div>
      <p class="text-on-surface-variant mb-8">{{ message }}</p>
      <div class="flex justify-end">
        <button class="px-8 py-3 rounded-pill bg-primary text-on-primary font-semibold hover:opacity-90 transition-opacity" type="button"
                onclick="document.getElementById('modal-slot').innerHTML = ''">Entendi</button>
      </div>
    </div>
  </div>
</div>
