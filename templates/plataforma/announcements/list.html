{% extends "plataforma/base.html" %}

{% block title %}Zelo — Avisos{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row md:items-end justify-between gap-6 mb-12">
  <div>
    <h2 class="font-display text-headline-md text-on-surface mb-2">Avisos</h2>
    <p class="text-on-surface-variant max-w-2xl">Envie atualizações do app pra todos os salões — aparece como sininho no painel de cada tenant_admin.</p>
  </div>
  <button class="shrink-0 flex items-center gap-2 bg-primary text-on-primary font-semibold text-lg px-8 py-3 rounded-full hover:opacity-90 transition-opacity shadow-sm active:scale-95"
          hx-get="{% url 'announcements:create' %}" hx-target="#modal-slot" hx-swap="innerHTML">
    <span class="material-symbols-outlined">add</span>
    Novo Aviso
  </button>
</div>

{% include "plataforma/announcements/_items.html" %}
{% endblock %}
