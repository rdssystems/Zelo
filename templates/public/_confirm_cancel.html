<div class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6" id="confirm-cancel-modal">
  <div class="absolute inset-0 bg-inverse-surface/40 backdrop-blur-sm"
       onclick="document.getElementById('modal-slot').innerHTML = ''"></div>
  <div class="relative w-full max-w-sm bg-surface-container-lowest rounded-2xl shadow-2xl overflow-hidden">
    <div class="p-8">
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 rounded-full bg-error-container flex items-center justify-center shrink-0">
          <span class="material-symbols-outlined text-error">warning</span>
        </div>
        <h3 class="font-semibold text-lg text-on-surface">Cancelar agendamento</h3>
      </div>
      <p class="text-on-surface-variant mb-8 text-sm">
        Deseja cancelar <strong class="text-on-surface">{{ appointment.service.name }}</strong> em
        {{ appointment.date|date:"d/m/Y" }} às {{ appointment.start_time|time:"H:i" }}?
        Esta ação não pode ser desfeita.
      </p>
      <div class="flex justify-end gap-3">
        <button class="px-5 py-2.5 rounded-full border border-outline text-on-surface-variant hover:bg-surface-container transition-colors text-sm" type="button"
                onclick="document.getElementById('modal-slot').innerHTML = ''">Manter</button>
        <button class="px-6 py-2.5 rounded-full bg-error text-on-error font-semibold hover:opacity-90 transition-opacity active:scale-95 text-sm"
                hx-post="{{ action_url }}" hx-target="#appointments-list" hx-swap="outerHTML">
          Cancelar agendamento
        </button>
      </div>
    </div>
  </div>
</div>
