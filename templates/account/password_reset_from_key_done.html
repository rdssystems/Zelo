{% extends "account/_base.html" %}
{% block title %}Senha alterada — Zellup{% endblock %}
{% block content %}
<div class="text-center">
  <div class="w-14 h-14 mx-auto mb-5 rounded-full bg-success-container flex items-center justify-center text-on-success-container">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <h1 class="font-display text-2xl text-on-background mb-2">Senha alterada</h1>
  <p class="text-sm text-on-surface-variant mb-6">Sua senha foi redefinida. Já pode entrar com ela.</p>
  <a class="inline-block bg-primary text-on-primary font-semibold text-sm uppercase tracking-wide py-3 px-6 rounded hover:brightness-110 transition-all" href="{% url 'login' %}">
    Ir para o login
  </a>
</div>
{% endblock %}
