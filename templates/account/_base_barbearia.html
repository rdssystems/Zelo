{% load static %}
<!DOCTYPE html>
<html class="dark" lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>{% block title %}Zellup{% endblock %}</title>
{% include "_favicon.html" %}
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&amp;family=Source+Sans+3:ital,wght@0,200..900;1,200..900&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="{% static 'css/login.css' %}" rel="stylesheet"/>
<script id="tailwind-config">
    tailwind.config = {
        darkMode: "class",
        theme: { extend: {
            "colors": {
                "surface-variant": "#353530", "on-primary": "#3c2f00", "surface-container-highest": "#353530",
                "surface-bright": "#3a3935", "error-container": "#93000a", "surface-container-lowest": "#0e0e0b",
                "error": "#ffb4ab", "surface-container": "#20201c", "outline": "#99907c",
                "on-error-container": "#ffdad6", "on-background": "#e5e2db", "surface": "#131410",
                "surface-container-high": "#2a2a26", "on-secondary": "#3f2c20", "inverse-surface": "#e5e2db",
                "primary-container": "#d4af37", "primary-fixed-dim": "#e9c349", "on-tertiary": "#313030",
                "on-surface": "#e5e2db", "outline-variant": "#4d4635", "on-primary-container": "#554300",
                "primary": "#f2ca50", "on-error": "#690005", "surface-dim": "#131410",
                "surface-container-low": "#1c1c18", "inverse-on-surface": "#31312c", "on-surface-variant": "#d0c5af",
                "background": "#131410"
            },
            "borderRadius": { "DEFAULT": "0.125rem", "lg": "0.25rem", "xl": "0.5rem", "full": "0.75rem" },
            "fontFamily": {
                "label-md": ["\"Source Sans 3\""], "headline-lg-mobile": ["Playfair Display"], "headline-lg": ["Playfair Display"],
                "body-lg": ["\"Source Sans 3\""], "display-lg": ["Playfair Display"], "display-md": ["Playfair Display"],
                "body-md": ["\"Source Sans 3\""]
            },
            "fontSize": {
                "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                "display-lg": ["56px", { "lineHeight": "64px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                "display-md": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]
            }
        } }
    }
</script>
{% block extra_head %}{% endblock %}
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center font-body-md overflow-x-hidden antialiased">
<div class="fixed inset-0 texture-overlay z-0"></div>
<div class="w-full min-h-screen flex flex-col md:flex-row relative z-10">
  <div class="w-full md:w-1/2 bg-login-barbearia bg-surface-container-lowest flex flex-col justify-center items-center p-8 md:p-16 relative overflow-hidden min-h-[30vh] md:min-h-screen inner-shadow-brass border-b md:border-b-0 md:border-r border-outline-variant">
    <div class="relative z-10 text-center flex flex-col items-center">
      <div class="w-16 h-16 md:w-24 md:h-24 mb-6 text-primary flex items-center justify-center border-2 border-primary rounded-full inner-shadow-brass bg-surface-container/50 backdrop-blur-sm">
        <span class="material-symbols-outlined text-4xl md:text-5xl" style="font-variation-settings: 'FILL' 0, 'wght' 200;">cut</span>
      </div>
      <h1 class="font-display-md text-display-md md:font-display-lg md:text-display-lg text-primary tracking-tighter mb-4">Zellup</h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm text-center italic">{% block tagline %}O cuidado que seu negócio merece.{% endblock %}</p>
    </div>
  </div>
  <div class="w-full md:w-1/2 bg-surface flex flex-col justify-center px-8 md:px-16 py-12 md:py-0 relative">
    <div class="max-w-md w-full mx-auto space-y-8">
      {% block content %}{% endblock %}
    </div>
  </div>
</div>
</body>
</html>
