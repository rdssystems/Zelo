# Override de desenvolvimento — aplicado automaticamente pelo `docker compose up`.
# Produção usa: docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
services:
  web:
    # Gunicorn também no dev (mesmo servidor da produção); --reload recarrega ao salvar arquivo
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --reload --workers 2
    environment:
      DJANGO_DEBUG: "True"
    volumes:
      - .:/app
      - ./media:/app/media
    # 8010 no host porque 8000/8080 já estão em uso por outros apps locais
    ports:
      - "8010:8000"

  celery_worker:
    environment:
      DJANGO_DEBUG: "True"
    volumes:
      - .:/app
      - ./media:/app/media

  celery_beat:
    environment:
      DJANGO_DEBUG: "True"
    volumes:
      - .:/app
