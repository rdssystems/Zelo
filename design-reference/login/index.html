<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zelo — Entrar</title>
  
  <!-- Google Fonts: Fraunces (Wordmark), Inter (Salão/Form), Archivo Narrow & Hanken Grotesk (Barbearia), Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:ital,wght@0,700;0,800;0,900;1,700&family=Fraunces:ital,opsz,wght@0,9..144,700;0,9..144,800;0,9..144,900;1,9..144,700&family=Hanken+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Floating State Bar for Quick Testing & Screenshots -->
  <div class="state-bar-container" id="stateBar">
    <div class="state-bar">
      <span class="state-bar-title">Zelo Preview:</span>
      <button type="button" class="state-btn active" id="btnDefault">1. Desktop Padrão</button>
      <button type="button" class="state-btn" id="btnError">2. Desktop Erro</button>
      <button type="button" class="state-btn" id="btnMobile">3. Mobile Padrão</button>
    </div>
  </div>

  <main class="page-wrapper" id="pageWrapper">
    <!-- LOGIN CONTAINER -->
    <div class="login-container" id="loginContainer">
      
      <!-- COLUNA ESQUERDA: PAINEL DE MARCA DUPLO (50/50 SPLIT) -->
      <section class="brand-panel" aria-label="Zelo Identidade">
        
        <!-- Metade Esquerda: Barbearia (Escura) -->
        <div class="brand-half brand-dark">
          <div class="dark-texture-overlay"></div>
          <div class="brand-subtle-badge dark-badge">
            <span class="badge-dot"></span>
            <span class="badge-text">BARBEARIA</span>
          </div>
        </div>

        <!-- Metade Direita: Salão (Clara) -->
        <div class="brand-half brand-light">
          <div class="light-texture-overlay"></div>
          <div class="brand-subtle-badge light-badge">
            <span class="badge-dot"></span>
            <span class="badge-text">SALÃO DE BELEZA</span>
          </div>
        </div>

        <!-- Linha de Costura Central -->
        <div class="seam-line">
          <div class="seam-ornament" title="Ponto de União Zelo">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="12" y="2" width="14.14" height="14.14" transform="rotate(45 12 2)" fill="#bc8848" stroke="#17130f" stroke-width="1.5"/>
            </svg>
          </div>
        </div>

        <!-- Momento de Marca Centralizado sobre a Costura -->
        <div class="brand-hero-content">
          <h1 class="brand-wordmark">Zelo</h1>
          <p class="brand-tagline">O cuidado que seu negócio merece</p>
        </div>

      </section>

      <!-- COLUNA DIREITA: FORMULÁRIO EM SUPERFÍCIE NEUTRA -->
      <section class="form-panel">
        <div class="form-card-container">
          
          <div class="form-header">
            <h2 class="form-title">Entrar na plataforma</h2>
            <p class="form-subtitle">Gerencie seu agendamento com facilidade</p>
          </div>

          <!-- Faixa de Estado de Erro -->
          <div class="alert-banner hidden" id="alertBanner" role="alert">
            <div class="alert-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
              </svg>
            </div>
            <div class="alert-message">
              E-mail ou senha inválidos. Verifique e tente novamente.
            </div>
          </div>

          <!-- Form Element -->
          <form class="login-form" id="loginForm" novalidate>
            
            <div class="field-group">
              <label for="emailInput" class="field-label">E-mail</label>
              <input 
                type="email" 
                id="emailInput" 
                name="email" 
                class="form-input" 
                placeholder="exemplo@zelo.com.br"
                required
                autocomplete="email"
              />
            </div>

            <div class="field-group">
              <label for="passwordInput" class="field-label">Senha</label>
              <input 
                type="password" 
                id="passwordInput" 
                name="password" 
                class="form-input" 
                placeholder="••••••••"
                required
                autocomplete="current-password"
              />
            </div>

            <button type="submit" class="btn-primary" id="submitBtn">
              Entrar
            </button>

          </form>

          <!-- Divisor -->
          <div class="divider">
            <span class="divider-line"></span>
            <span class="divider-text">ou</span>
            <span class="divider-line"></span>
          </div>

          <!-- Botão Secundário Google -->
          <button type="button" class="btn-google" id="googleBtn">
            <svg class="google-icon" width="18" height="18" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Continuar com Google</span>
          </button>

        </div>

        <!-- Link fora do Card -->
        <div class="form-footer">
          <p class="signup-text">
            Ainda não tem um salão cadastrado? <a href="#" class="signup-link">Cadastre-se</a>
          </p>
        </div>

      </section>

    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
